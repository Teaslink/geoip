name: Sync upstream master

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync master to upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::UPSTREAM_SYNC_TOKEN is not configured"
            exit 1
          fi
          gh api --method POST "repos/${{ github.repository }}/merge-upstream" --field branch=master
