name: Sync upstream master

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync master to upstream
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Loyalsoldier/geoip.git || git remote set-url upstream https://github.com/Loyalsoldier/geoip.git
          git fetch upstream
          git checkout master
          git reset --hard upstream/master
          git push --force origin master
